services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xreplicator
      POSTGRES_USER: xreplicator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xreplicator-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xreplicator -d xreplicator"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/xreplicator-backups

  backup-server:
    image: ghcr.io/xmigrate/xreplicator-backup-server:${XREPLICATOR_VERSION:-1.4.3}
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    environment:
      XREPLICATOR_INSTANCE_ID: compose-backup-server-1
      XREPLICATOR_ADVERTISE_ADDR: backup-server:50051
      XREPLICATOR_POSTGRES_DSN: postgres://xreplicator:${POSTGRES_PASSWORD:-xreplicator-change-me}@postgres:5432/xreplicator?sslmode=disable
      XREPLICATOR_ACTIVE_ACTIVE: "false"
      XREPLICATOR_STORAGE_BACKEND: object
      XREPLICATOR_OBJECT_PROVIDER: s3
      XREPLICATOR_OBJECT_ENDPOINT: minio:9000
      XREPLICATOR_OBJECT_BUCKET: xreplicator-backups
      XREPLICATOR_OBJECT_PREFIX: repo
      XREPLICATOR_OBJECT_USE_SSL: "false"
      XREPLICATOR_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      XREPLICATOR_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      XREPLICATOR_INTERNAL_SECRET: ${XREPLICATOR_INTERNAL_SECRET:-xreplicator-internal-change-me}
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes:
      - backup-server-data:/var/lib/xreplicator
      - ./tls:/etc/xreplicator/tls:ro
      - ./license:/etc/xreplicator/license:ro

  frontend:
    image: ghcr.io/xmigrate/xreplicator-frontend:${XREPLICATOR_VERSION:-1.4.3}
    depends_on:
      backup-server:
        condition: service_healthy
    environment:
      BACKUP_GRPC_ADDRESS: backup-server:50051
      BACKUP_GRPC_CA_FILE: /etc/xreplicator/tls/ca.crt
      BACKUP_GRPC_CERT_FILE: /etc/xreplicator/tls/tls.crt
      BACKUP_GRPC_KEY_FILE: /etc/xreplicator/tls/tls.key
      BACKUP_GRPC_SERVER_NAME: backup-server.xmigrate.com
      XREPLICATOR_INTERNAL_SECRET: ${XREPLICATOR_INTERNAL_SECRET:-xreplicator-internal-change-me}
      XREPLICATOR_WEB_SESSION_SECRET: ${XREPLICATOR_WEB_SESSION_SECRET:-xreplicator-web-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./tls:/etc/xreplicator/tls:ro

volumes:
  postgres-data:
  minio-data:
  backup-server-data:
