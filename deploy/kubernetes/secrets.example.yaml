apiVersion: v1
kind: Secret
metadata:
  name: xreplicator-backup-server
  namespace: xreplicator
type: Opaque
stringData:
  postgres-dsn: "postgres://xreplicator:xreplicator-change-me@xreplicator-postgres:5432/xreplicator?sslmode=disable"
  postgres-password: "xreplicator-change-me"
  object-access-key: "minioadmin"
  object-secret-key: "minioadmin-change-me"
  internal-secret: "change-me"
  web-session-secret: "change-me-too"
---
apiVersion: v1
kind: Secret
metadata:
  name: xreplicator-license
  namespace: xreplicator
type: Opaque
stringData:
  license.json: |
    paste-license-json-here
---
apiVersion: v1
kind: Secret
metadata:
  name: xreplicator-tls
  namespace: xreplicator
type: kubernetes.io/tls
stringData:
  tls.crt: |
    paste-server-cert-here
  tls.key: |
    paste-server-key-here
  ca.crt: |
    paste-ca-cert-here
