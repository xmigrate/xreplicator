apiVersion: v1
kind: Service
metadata:
  name: xreplicator-postgres
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-postgres
spec:
  selector:
    app.kubernetes.io/name: xreplicator-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xreplicator-postgres
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-postgres
spec:
  serviceName: xreplicator-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xreplicator-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xreplicator-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: xreplicator
            - name: POSTGRES_USER
              value: xreplicator
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "xreplicator", "-d", "xreplicator"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xreplicator-minio
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-minio
spec:
  selector:
    app.kubernetes.io/name: xreplicator-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xreplicator-minio
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-minio
spec:
  serviceName: xreplicator-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xreplicator-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xreplicator-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: object-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: object-secret-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xreplicator-minio-bucket
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-minio-bucket
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xreplicator-minio-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: object-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: object-secret-key
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://xreplicator-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/xreplicator-backups
