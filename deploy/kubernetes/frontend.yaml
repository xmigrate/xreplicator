apiVersion: apps/v1
kind: Deployment
metadata:
  name: xreplicator-frontend
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xreplicator-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xreplicator-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/xmigrate/xreplicator-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKUP_GRPC_ADDRESS
              value: xreplicator-backup-server.xreplicator.svc.cluster.local:50051
            - name: BACKUP_GRPC_CA_FILE
              value: /etc/xreplicator/tls/ca.crt
            - name: BACKUP_GRPC_CERT_FILE
              value: /etc/xreplicator/tls/tls.crt
            - name: BACKUP_GRPC_KEY_FILE
              value: /etc/xreplicator/tls/tls.key
            - name: BACKUP_GRPC_SERVER_NAME
              value: backup-server.xmigrate.com
            - name: XREPLICATOR_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: internal-secret
            - name: XREPLICATOR_WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: xreplicator-backup-server
                  key: web-session-secret
          volumeMounts:
            - name: tls
              mountPath: /etc/xreplicator/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tls
          secret:
            secretName: xreplicator-tls
---
apiVersion: v1
kind: Service
metadata:
  name: xreplicator-frontend
  namespace: xreplicator
  labels:
    app.kubernetes.io/name: xreplicator-frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: xreplicator-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
