name: Backup Server Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.5.0 or v1.5.0
        required: false
      package_url:
        description: Optional HTTPS package URL override. Otherwise discover the linux amd64 deb from the release.
        required: false
      push_latest:
        description: Also push the latest tag
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xmigrate/xreplicator-backup-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release input
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PACKAGE_URL: ${{ inputs.package_url }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          package_url="${INPUT_PACKAGE_URL}"
          push_latest="${INPUT_PUSH_LATEST:-true}"
          release_tag=""
          package_name=""

          if [ "${EVENT_NAME}" = "release" ]; then
            version="${RELEASE_TAG#v}"
            release_tag="${RELEASE_TAG}"
            push_latest="true"
          elif [ -n "${version}" ]; then
            release_tag="v${version}"
          fi

          if [ -z "${version}" ]; then
            echo "version is required for manual runs" >&2
            exit 1
          fi

          if [ -z "${package_url}" ]; then
            package_name="$(
              gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" --json assets \
                --jq '[.assets[]
                  | select(.name | test("^(backup-server|xreplicator-backup-server).*amd64.*\\.deb$"))
                  | .name] | sort | .[0] // empty'
            )"
            if [ -z "${package_name}" ]; then
              echo "linux amd64 backup server deb asset was not found in ${GITHUB_REPOSITORY} release ${release_tag}" >&2
              exit 1
            fi
          fi

          if [ -n "${package_url}" ] && [[ "${package_url}" != https://* ]]; then
            echo "package_url must use HTTPS" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "package_url=${package_url}"
            echo "push_latest=${push_latest}"
            echo "release_tag=${release_tag}"
            echo "package_name=${package_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Download backup server package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_URL: ${{ steps.release.outputs.package_url }}
        run: |
          set -euo pipefail
          if [ -n "${PACKAGE_NAME}" ]; then
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${PACKAGE_NAME}" \
              --output container/backup-server/backup.deb
          else
            curl -fsSL "${PACKAGE_URL}" -o container/backup-server/backup.deb
          fi
          dpkg-deb --field container/backup-server/backup.deb Package Version Architecture
          test "$(dpkg-deb --field container/backup-server/backup.deb Architecture)" = "amd64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${{ steps.release.outputs.version }}"
            if [ "${{ steps.release.outputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container/backup-server
          file: container/backup-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
