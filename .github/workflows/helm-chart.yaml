name: Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Chart/app version, for example 1.5.0
        required: true
      upload_release:
        description: Upload chart package to the matching GitHub release
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  packages: write

env:
  CHART_DIR: charts/xreplicator-backup-server
  CHART_NAME: xreplicator-backup-server
  OCI_REPOSITORY: oci://ghcr.io/xmigrate/charts

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD_RELEASE: ${{ inputs.upload_release }}
        run: |
          set -eu

          version="${INPUT_VERSION}"
          release_tag="${INPUT_VERSION:+v${INPUT_VERSION}}"
          upload_release="${INPUT_UPLOAD_RELEASE:-false}"

          if [ "${EVENT_NAME}" = "release" ]; then
            version="${RELEASE_TAG#v}"
            release_tag="${RELEASE_TAG}"
            upload_release="true"
          fi

          if [ -z "${version}" ]; then
            echo "version is required" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "upload_release=${upload_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHART_NAME }}-${{ steps.release.outputs.version }}
          path: dist/${{ env.CHART_NAME }}-${{ steps.release.outputs.version }}.tgz
          if-no-files-found: error

      - name: Upload chart to GitHub release
        if: steps.release.outputs.upload_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.release_tag }}" \
            "dist/${CHART_NAME}-${{ steps.release.outputs.version }}.tgz" \
            --clobber

      - name: Log in to GHCR Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            "dist/${CHART_NAME}-${{ steps.release.outputs.version }}.tgz" \
            "${OCI_REPOSITORY}"
