apiVersion: v1
kind: Service
metadata:
  name: {{ include "xreplicator-backup-server.fullname" . }}-headless
  labels:
    {{- include "xreplicator-backup-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "xreplicator-backup-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xreplicator-backup-server.fullname" . }}
  labels:
    {{- include "xreplicator-backup-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "xreplicator-backup-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
