{{- if or .Values.postgres.enabled .Values.minio.enabled (not .Values.internalAuth.secretName) (and .Values.frontend.enabled (not .Values.frontend.webSessionSecretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xreplicator-backup-server.secretName" . }}
  labels:
    {{- include "xreplicator-backup-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-dsn: {{ include "xreplicator-backup-server.postgresDsn" . | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  object-access-key: {{ .Values.minio.rootUser | quote }}
  object-secret-key: {{ .Values.minio.rootPassword | quote }}
  {{- end }}
  internal-secret: {{ .Values.internalAuth.value | quote }}
  web-session-secret: {{ .Values.frontend.webSessionSecretValue | quote }}
{{- end }}
